# Cards dashboard over HTTPS, same pattern as the events site on 3001.
# The Cloudflare tunnel points the dashboard domain at https://localhost:3002.
# Node listens on 127.0.0.1:3102 only, so everything outside goes through here.
server {
    listen 3002 ssl http2;
    listen [::]:3002 ssl http2;
    server_name cards.boba-bash.xyz _;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cards_ssl:5m;

    # uploads are capped at 10 MB by the app
    client_max_body_size 12m;
    proxy_read_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # when the app is restarting, show our own page instead of nginx's
    error_page 502 503 504 =503 @down;

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    location @down {
        root /var/www/cards-down;
        try_files /index.html =503;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }
}
