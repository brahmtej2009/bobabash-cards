<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery · Boba Bash Greater Noida</title>
  <meta name="description" content="Photos from Boba Bash Greater Noida, shared by the people who were there.">
  <meta name="theme-color" content="#fbf6e8">
  <link rel="icon" href="/static/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/gallery.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="/"><img src="/static/boba-bash.webp" alt="Hack Club's Boba Bash" width="120" height="83"></a>
    <div class="titles">
      <h1>Gallery</h1>
      <p id="sub">Photos from the people who were there.</p>
    </div>
    <button class="add play" id="ssStart" type="button" hidden>▶ Slideshow</button>
    <a class="add" href="/me">+ Add your photos</a>
  </header>

  <!-- slideshow: full screen, one photo at a time -->
  <div class="ss" id="ss" hidden>
    <img class="ss-img" id="ssA" alt="">
    <img class="ss-img" id="ssB" alt="">
    <div class="ss-cap" id="ssCap"><b id="ssCapT"></b><span id="ssCapBy"></span></div>
    <div class="ss-count" id="ssCount"></div>
    <div class="ss-bar"><i id="ssProg"></i></div>

    <div class="ss-timer" id="ssTimer" hidden>
      <span class="t" id="tClock">05:00</span>
      <span class="ss-done" id="tDone" hidden>Time's up!</span>
    </div>

    <div class="ss-ui" id="ssUi">
      <button type="button" id="ssPrev" title="Previous (←)">‹</button>
      <button type="button" id="ssPlay" title="Pause / play (Space)">❚❚</button>
      <button type="button" id="ssNext" title="Next (→)">›</button>
      <span class="ss-seg" id="ssSpeed">
        <button type="button" data-ms="12000">Slow</button>
        <button type="button" data-ms="7000">Normal</button>
        <button type="button" data-ms="3500">Fast</button>
      </span>
      <span class="ss-sep"></span>
      <span class="ss-timerset">
        <input id="tMin" type="number" min="1" max="180" value="5" aria-label="Timer minutes"><span>min</span>
        <button type="button" id="tGo" title="Start / pause the timer (T)">⏱ Start timer</button>
        <button type="button" id="tReset" title="Reset timer">↺</button>
        <button type="button" id="tHide" title="Hide timer">✕</button>
      </span>
      <span class="ss-sep"></span>
      <button type="button" id="ssFs" title="Full screen (F)">⛶</button>
      <button type="button" id="ssExit" title="Close (Esc)">Close</button>
    </div>
  </div>

  <main>
    <p class="empty" id="empty" hidden>No photos yet. Log in at <a href="/me">your dashboard</a> and add the first one!</p>
    <div class="grid" id="grid"></div>
  </main>

  <div class="lb" id="lb" hidden>
    <button class="lb-x" id="lbClose" type="button" aria-label="Close">✕</button>
    <button class="lb-nav prev" id="lbPrev" type="button" aria-label="Previous">‹</button>
    <figure>
      <img id="lbImg" alt="">
      <figcaption><b id="lbCap"></b><span id="lbBy"></span></figcaption>
    </figure>
    <button class="lb-nav next" id="lbNext" type="button" aria-label="Next">›</button>
  </div>

  <script src="/static/gallery.js"></script>
</body>
</html>
